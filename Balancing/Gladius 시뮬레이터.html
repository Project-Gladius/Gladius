:root {
  --bg: #0c1017;
  --panel: #141b25;
  --soft: #1b2431;
  --line: #2a3545;
  --text: #ecf1f7;
  --muted: #9aaabd;
  --accent: #91e3b5;
  --blue: #88b7ff;
  --gold: #ffd08a;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial,'Malgun Gothic',sans-serif;
  font-size: 16px;
  line-height: 1.5;
}
button,input,select,textarea {
  font: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: .4;
}
input,select,textarea {
  background: #0e1520;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--text);
  padding: 8px;
  width: 100%;
  min-width: 0;
}
input:focus,select:focus,textarea:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
button {
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--soft);
  color: var(--text);
  padding: 8px 14px;
}
button:hover {
  border-color: var(--muted);
}
button.primary {
  background: var(--accent);
  color: #10271a;
  border-color: var(--accent);
  font-weight: 700;
}
a {
  color: var(--blue);
}
h1,h2,h3,p {
  margin: 0;
}
h1 {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -1px;
}
h2 {
  font-size: 18px;
  font-weight: 700;
}
h3 {
  font-size: 16px;
  font-weight: 700;
}
.workspace {
  max-width: 1900px;
  margin: auto;
  padding: 0 28px 40px;
}
.topbar {
  height: 80px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-icon {
  display: grid;
  place-items: center;
  background: var(--accent);
  color: #0a1c12;
  width: 36px;
  height: 40px;
  font-weight: 900;
  clip-path: polygon(0 0,100% 0,100% 80%,50% 100%,0 80%);
}
.brand strong {
  letter-spacing: 3px;
  font-size: 15px;
}
.brand span:not(.brand-icon) {
  font-size: 14px;
  margin-left: 16px;
  color: var(--muted);
}
.tag,.eyebrow {
  font-size: 12px;
  letter-spacing: 1.5px;
  color: var(--accent);
  font-weight: 700;
}
.tag {
  border: 1px solid var(--line);
  padding: 5px 9px;
  border-radius: 5px;
}
.intro {
  padding: 26px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}
.intro p {
  color: var(--muted);
  margin-top: 6px;
}
.eyebrow {
  display: block;
  margin-bottom: 7px;
}
.main-grid {
  display: grid;
  grid-template-columns: 300px minmax(0,1fr);
  gap: 20px;
  align-items: start;
}
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 20px;
}
.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 14px;
  color: var(--muted);
}
.field input,.field select {
  color: var(--text);
}
.muted {
  color: var(--muted);
  font-size: 14px;
}
.turn-preview {
  display: flex;
  gap: 10px;
  margin: 25px 0;
}
.turn-preview>div {
  padding: 18px;
  border: 1px solid var(--line);
  border-top: 3px solid var(--accent);
  flex: 1;
}
.turn-preview small,.turn-preview strong {
  display: block;
}
.turn-preview small {
  color: var(--muted);
  margin-bottom: 12px;
}
.row {
  display: flex;
  gap: 10px;
  align-items: center;
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
@media (max-width:900px) {
  .main-grid {
    grid-template-columns: 1fr;
  }
  .workspace {
    padding: 0 14px 30px;
  }
  .intro {
    align-items: start;
    flex-direction: column;
  }
  .topbar {
    height: auto;
    min-height: 75px;
    flex-wrap: wrap;
    padding: 12px 0;
  }
}
button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-size: 14px;
  white-space: nowrap;
}
h2 {
  display: flex;
  align-items: center;
  gap: 9px;
}
h2 svg {
  color: var(--muted);
}
.fields {
  display: grid;
  gap: 12px;
}
.two {
  grid-template-columns: repeat(2,minmax(0,1fr));
}
.three {
  grid-template-columns: repeat(3,minmax(0,1fr));
}
.sidebar {
  position: sticky;
  top: 16px;
}
.field-note {
  font-size: 13px;
  color: var(--muted);
  align-self: end;
  padding-bottom: 8px;
}
.small-note {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.7;
  margin-top: 12px;
}
.skill {
  padding: 18px 0;
  border-top: 1px solid var(--line);
}
.skill:last-child {
  padding-bottom: 0;
}
.skill-head {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 12px;
}
.skill-head input {
  background: transparent;
  border: 0;
  padding: 4px 0;
  font-weight: 700;
}
.skill-badge {
  font-size: 13px;
  font-weight: 700;
  padding: 4px 7px;
  border-radius: 4px;
  background: #203451;
  color: var(--blue);
}
.s1 {
  background: #342f47;
  color: #c2afff;
}
.mode-switch {
  display: flex;
  border: 1px solid var(--line);
  padding: 4px;
  border-radius: 8px;
  background: var(--panel);
}
.mode-switch button {
  border: 0;
  background: none;
  padding: 9px 17px;
  color: var(--muted);
}
.mode-switch button.active {
  background: var(--accent);
  color: #10271a;
  font-weight: 700;
}
.summary-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.summary-grid>div {
  background: var(--panel);
  padding: 18px 22px;
}
.summary-grid span,.summary-grid small {
  display: block;
  color: var(--muted);
  font-size: 13px;
}
.summary-grid strong {
  display: block;
  font-size: 29px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}
.summary-grid em {
  font-size: 14px;
  font-style: normal;
  color: var(--muted);
}
.green {
  color: var(--accent);
}
.live-status {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 7px;
}
.live-status i {
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
}
.live-status.working i {
  background: var(--gold);
  animation: pulse 1s infinite;
}
.section-heading>div>p {
  margin-top: 5px;
}
.pattern-scroll {
  overflow: auto;
  max-height: 355px;
  border: 1px solid var(--line);
  border-radius: 7px;
}
.pattern-table,.line-table,.trace-table {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
  font-size: 14px;
}
.pattern-table th,.pattern-table td {
  padding: 10px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.pattern-table th:first-child {
  min-width: 150px;
  width: 160px;
}
.pattern-table td {
  min-width: 210px;
}
.pattern-table td:last-child {
  min-width: 40px;
  width: 40px;
}
.pattern-table thead th {
  background: #1d2835;
  color: var(--muted);
  position: sticky;
  top: 0;
  z-index: 2;
  font-size: 13px;
}
.pattern-table th input {
  margin-top: 5px;
  font-size: 13px;
}
.turn-number {
  display: block;
  text-align: left;
  font-size: 16px;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.zone-top {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.zone-top+.zone-top {
  margin-top: 7px;
}
.pattern-table .field {
  font-size: 12px;
  gap: 3px;
}
.pattern-table input,.pattern-table select {
  font-size: 14px;
  padding: 5px;
}
.turn-buttons {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.turn-buttons button {
  padding: 3px;
  background: transparent;
}
.line-scroll {
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 7px;
  max-height: 650px;
}
.line-table th,.line-table td {
  border-bottom: 1px solid var(--line);
  padding: 9px 7px;
  white-space: nowrap;
}
.line-table thead th,.trace-table thead th {
  background: #1d2835;
  color: var(--muted);
  font-size: 13px;
  position: sticky;
  top: 0;
  z-index: 2;
}
.line-table th:first-child {
  position: sticky;
  left: 0;
  background: #17202d;
  z-index: 1;
  min-width: 60px;
}
.line-table thead th:first-child {
  z-index: 3;
}
.line-table td:not(.numeric) {
  min-width: 115px;
}
.line-table td small {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin-top: 5px;
  padding-left: 3px;
}
.action-select {
  font-size: 14px;
  border: 1px solid transparent;
  padding: 8px 3px;
  font-weight: 600;
  cursor: pointer;
}
.action-select.attack {
  background: #1d304a;
  color: var(--blue);
}
.action-select.defense {
  background: #303026;
  color: var(--gold);
}
.action-select.evade {
  background: #17352e;
  color: var(--accent);
}
.action-select:disabled {
  opacity: .75;
  cursor: default;
}
.fixed-cell {
  background: #111722;
}
.line-label {
  background: none;
  border: 0;
  padding: 5px;
  color: var(--muted);
}
.numeric {
  font-variant-numeric: tabular-nums;
  text-align: right;
  min-width: 85px;
}
.damage-value {
  color: var(--blue);
  font-weight: 700;
}
.selected-row {
  background: #1b2938;
}
.dead-row .numeric {
  color: #ff9c9c;
}
.branch-heading td {
  background: #192431;
  white-space: normal;
  padding: 8px 13px;
}
.branch-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}
.branch-strip>span {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--accent);
  font-size: 12px;
}
.branch-strip button {
  padding: 2px 4px;
  border: 0;
  background: none;
}
.child-row {
  background: #101923;
}
.notice {
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 7px;
  color: var(--muted);
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.error-text {
  color: #ffaeae;
}
.spinner {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 2px solid var(--line);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
.chart-legend {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 12px;
}
.blue-dot,.green-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  background: var(--blue);
}
.green-dot {
  background: var(--accent);
  margin-left: 18px;
}
.bar-chart {
  max-height: 300px;
  overflow: auto;
}
.bar-row {
  width: 100%;
  display: grid;
  grid-template-columns: 30px 1fr 1fr;
  gap: 16px;
  border: 0;
  background: transparent;
  border-radius: 0;
  padding: 9px 0;
}
.bar-row:hover {
  background: var(--soft);
}
.bar-row>span {
  font-size: 13px;
  color: var(--muted);
}
.bar-row>div {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.bar-track {
  background: #25303e;
  height: 9px;
  border-radius: 3px;
  flex: 1;
  overflow: hidden;
}
.bar-track i {
  display: block;
  height: 100%;
  border-radius: 3px;
  min-width: 1px;
}
.damage-bar {
  background: var(--blue);
}
.survival-bar {
  background: var(--accent);
}
.bar-row b {
  font-size: 13px;
  font-weight: 400;
  width: 68px;
  text-align: right;
}
.trace-table td,.trace-table th {
  padding: 10px 13px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
footer {
  padding-top: 26px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}
dialog {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 12px;
  width: min(720px,calc(100vw - 28px));
  max-height: 90vh;
  padding: 0;
  position: fixed;
  inset: 0;
  margin: auto;
  box-shadow: 0 25px 100px #0008;
}
dialog::backdrop {
  background: #020710b8;
  backdrop-filter: blur(3px);
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: var(--panel);
  z-index: 1;
}
.modal-head button {
  border: 0;
  padding: 6px;
  background: none;
}
.modal-body {
  padding: 24px;
}
.modal-body textarea {
  font-family: Consolas,monospace;
  font-size: 13px;
  resize: vertical;
  min-height: 160px;
}
.file-button {
  display: inline-flex;
  gap: 7px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 8px 14px;
  font-size: 14px;
  cursor: pointer;
}
.file-button input {
  display: none;
}
.import-preview {
  border-left: 3px solid var(--accent);
  padding: 14px 18px;
  background: var(--soft);
  font-size: 14px;
}
.import-preview ol {
  margin: 14px 0 18px;
  padding-left: 20px;
}
.error-text.notice {
  background: #351e27;
}
.analysis {
  min-width: 0;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes pulse {
  50% {
    opacity: .3;
  }
}
@media (max-width:1100px) {
  .main-grid {
    grid-template-columns: 270px minmax(0,1fr);
  }
  .workspace {
    padding: 0 18px 30px;
  }
  .panel {
    padding: 15px;
  }
  .summary-grid>div {
    padding: 14px;
  }
  .summary-grid strong {
    font-size: 24px;
  }
}
@media (max-width:900px) {
  .main-grid {
    grid-template-columns: 1fr;
  }
  .sidebar {
    position: static;
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    align-items: start;
  }
  .sidebar>section:last-child {
    grid-column: 1/-1;
  }
  .summary-grid strong {
    font-size: 23px;
  }
  .brand span:not(.brand-icon) {
    margin-left: 10px;
  }
  .section-heading {
    flex-wrap: wrap;
  }
}
@media (max-width:560px) {
  .sidebar {
    display: flex;
  }
  .summary-grid {
    grid-template-columns: 1fr 1fr;
  }
  .summary-grid>div:last-child {
    grid-column: 1/-1;
  }
  .intro h1 {
    font-size: 25px;
  }
  .brand strong {
    letter-spacing: 1px;
  }
  .brand span:not(.brand-icon) {
    display: none;
  }
  .live-status {
    display: none;
  }
  .chart-legend {
    flex-wrap: wrap;
  }
  .bar-row {
    gap: 7px;
    grid-template-columns: 22px 1fr 1fr;
  }
  .modal-body {
    padding: 16px;
  }
  .row {
    flex-wrap: wrap;
  }
}
.summary-grid.four {
  grid-template-columns: repeat(4,minmax(0,1fr));
}
.check-option {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}
.check-option input {
  width: auto;
  accent-color: #10b981;
}
.distribution-chart {
  width: 100%;
  height: auto;
  min-height: 180px;
}
.distribution-chart text {
  font-size: 12px;
  fill: #94a3b8;
}
.dead-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #94a3b8;
  display: inline-block;
}
@media (max-width:1100px) {
  .summary-grid.four {
    grid-template-columns: repeat(2,minmax(0,1fr));
  }
}
.save-controls {
  display: flex;
  align-items: end;
  gap: 10px;
  flex-wrap: wrap;
}
.save-controls .field:first-child {
  flex: 2;
  min-width: 220px;
}
.save-controls .field {
  flex: 1;
  min-width: 150px;
}
.save-panel {
  margin-bottom: 2px;
}
