<script>/* Shared combat engine. The browser, both workers and Node tests run this exact code. */
function createEngine(){
'use strict';
const zones=['left','center','right'], names=['공격 1','공격 2','방어','회피·좌','회피·중','회피·우'];
const clone=x=>JSON.parse(JSON.stringify(x)), sum=a=>a.reduce((x,y)=>x+y,0), key=x=>Number(x.toFixed(8));
function assert(ok,msg){if(!ok)throw Error(msg);}
function number(v,min,max,label,int=false){assert(typeof v==='number'&&Number.isFinite(v)&&v>=min&&v<=max&&(!int||Number.isInteger(v)),label+' 범위: '+min+'~'+max+(int?' 정수':''));}
function str(v,label){assert(typeof v==='string'&&v.trim().length>0&&v.length<=200,label+'을 확인하세요.');}
function unique(list,label){assert(Array.isArray(list)&&list.length>0,label+'이 비어 있습니다.');const ids=new Set();list.forEach(x=>{assert(/^[A-Za-z0-9_]+$/.test(x.id),label+' ID는 영문·숫자·밑줄만 사용합니다.');assert(!ids.has(x.id),label+' ID 중복: '+x.id);ids.add(x.id);str(x.name,label+' 이름');});return ids;}
// External state schema stays separate from the simulator's combat representation.
function importBoss(source){
 if(!source?.states)return source;
 assert(source.schemaVersion===2,'보스 상태 JSON 버전은 2여야 합니다.');
 assert(Array.isArray(source.states)&&source.states.length>0,'보스 상태가 비어 있습니다.');
 const ids=new Set();
 const actions=source.states.map(s=>{
  str(s.id,'상태 ID');assert(/^[A-Za-z0-9_]+$/.test(s.id)&&!ids.has(s.id),'잘못되었거나 중복된 상태 ID: '+s.id);ids.add(s.id);
  number(s.totalDamage,0,100,'총 대미지',true);str(s.telegraphText,'예고 텍스트');
  const t=s.target;assert(t&&['none','fixed','randomOne','selectOne'].includes(t.mode)&&Array.isArray(t.zones),'타격 구역 형식 오류: '+s.id);
  assert(t.zones.every(z=>zones.includes(z))&&new Set(t.zones).size===t.zones.length,'타격 구역 오류: '+s.id);
  assert(t.mode==='none'?t.zones.length===0&&s.totalDamage===0:t.zones.length>0,'공격/비공격 구역 오류: '+s.id);
  for(const z of zones)assert(['vulnerable','normal','resistant'].includes(s.vulnerabilityByZone?.[z]),'구역별 취약도 오류: '+s.id);
  return {id:s.id,name:s.name||s.id,totalDamage:s.totalDamage,target:clone(t),vulnerabilityByZone:clone(s.vulnerabilityByZone),hitCount:1,
   damageByZone:Object.fromEntries(zones.map(z=>[z,t.zones.includes(z)?s.totalDamage:0])),attributeByZone:Object.fromEntries(zones.map(z=>[z,'physical'])),
   resistanceByZone:Object.fromEntries(zones.map(z=>{const v=s.vulnerabilityByZone[z]==='resistant'?'enduring':s.vulnerabilityByZone[z];return [z,{physical:v,magical:v}];})),telegraph:{text:s.telegraphText,motionId:''},attackMotionId:''};
 });
 assert(Array.isArray(source.patterns)&&source.patterns.length>0,'패턴이 비어 있습니다.');
 const patterns=source.patterns.map((p,i)=>{str(p.name,'패턴 이름');assert(Array.isArray(p.sequence)&&p.sequence.length>0&&p.sequence.every(id=>ids.has(id)),'패턴 상태 참조 오류: '+p.name);assert(p.turns===p.sequence.length,'패턴 턴 수와 상태 수가 다릅니다: '+p.name);return {id:'pattern_'+i,name:p.name,steps:clone(p.sequence)};});
 const config=source.simulation||{}, preset=config.preset||{};
 const patternId=i=>{assert(Number.isInteger(i)&&patterns[i],'시뮬레이션 패턴 번호 오류');return patterns[i].id;};
 return {schemaVersion:1,kind:'gladius-boss-patterns',revision:1,name:source.name||'보스',maxHp:config.maxHp??100,
  encounter:clone(config.encounter||{turns:10,patternFit:'remainingTurns'}),actions,patterns,
  selection:{mode:'weightedRandom',allowImmediateRepeat:config.allowImmediateRepeat??true,pool:patterns.map((p,i)=>({patternId:p.id,weight:config.weights?.[i]??1}))},
  preset:{mode:preset.mode||'random',seed:preset.seed??20261018,customPatterns:(preset.customPatternIndices||[0]).map(patternId),directActions:clone(preset.directActions||patterns[0].steps)},
  stateFormat:{schemaVersion:2,damageRule:source.damageRule}};
}
function exportBoss(b){
 if(!b.stateFormat)return clone(b);
 const out={schemaVersion:2,name:b.name,states:b.actions.map(a=>({id:a.id,...(a.name!==a.id?{name:a.name}:{}),totalDamage:a.totalDamage,target:clone(a.target),telegraphText:a.telegraph.text,vulnerabilityByZone:clone(a.vulnerabilityByZone)})),
  patterns:b.patterns.map(p=>({name:p.name,turns:p.steps.length,sequence:clone(p.steps)}))};
 if(b.stateFormat.damageRule)out.damageRule=b.stateFormat.damageRule;
 out.simulation={maxHp:b.maxHp,encounter:clone(b.encounter),allowImmediateRepeat:b.selection.allowImmediateRepeat,weights:b.patterns.map(p=>b.selection.pool.find(x=>x.patternId===p.id)?.weight??0),preset:{mode:b.preset.mode,seed:b.preset.seed,customPatternIndices:b.preset.customPatterns.map(id=>b.patterns.findIndex(p=>p.id===id)),directActions:clone(b.preset.directActions)}};
 return out;
}
function syncState(a){
 if(!a.target)return;
 a.hitCount=1;
 for(const z of zones){a.damageByZone[z]=a.target.zones.includes(z)?a.totalDamage:0;const v=a.vulnerabilityByZone[z]==='resistant'?'enduring':a.vulnerabilityByZone[z];a.resistanceByZone[z]={physical:v,magical:v};}
}
function attackVariants(a){
 if(!a.target||!['randomOne','selectOne'].includes(a.target.mode))return [a];
 return a.target.zones.map(z=>({...a,damageByZone:Object.fromEntries(zones.map(k=>[k,k===z?a.totalDamage:0]))}));
}
function validate(data){
 if(data.bosses?.states)data.bosses=importBoss(data.bosses);
 const {abilities:a,bosses:b,enhancements:e}=data;
 if(b.stateFormat)importBoss(exportBoss(b));
 b.actions?.forEach(syncState);
 for(const [x,kind] of [[a,'abilities'],[b,'boss-patterns'],[e,'enhancements']]){assert(x&&x.schemaVersion===1&&x.kind==='gladius-'+kind,'지원하지 않는 JSON 형식: '+kind);number(x.revision,1,1e9,'개정 번호',true);}
 const r=a.rules;assert(r,'전투 규칙이 없습니다.');
 number(r.attackFeverGain,0,100,'공격 피버');number(r.defenseFeverGain,0,100,'방어 피버');number(r.feverDamageCoefficient,0,20,'피버 피해 계수');number(r.evadeThreshold,1,100,'연속 회피 기준',true);number(r.evadeReduction,0,1,'회피 감소율');
 assert(['everyAfter','eachN'].includes(r.evadeRepeat),'피버 반복 방식 오류');assert(['floor','round','none'].includes(r.feverRounding),'피버 소수 처리 오류');assert(typeof r.allowStayEvade==='boolean','현재 위치 회피는 true/false입니다.');
 if(r.feverCap!==null)number(r.feverCap,0,10000,'피버 상한');
 assert(r.attackDamageRounding==='roundHalfUp'&&r.defenseDamageRounding==='ceil','공격 피해 반올림 / 방어 피해 올림 규칙을 유지하세요.');
 assert(JSON.stringify(r.turnOrder)===JSON.stringify(['move','playerAttack','bossAttack','feverAndDeath']),'턴 처리 순서가 다릅니다.');
 for(const k of ['enduring','normal','vulnerable'])number(r.resistanceMultipliers?.[k],0,10,'내성 배율');
 number(a.initial?.fever,0,10000,'시작 피버');number(a.initial?.evadeStreak,0,100,'시작 연속 회피',true);assert(zones.includes(a.initial?.zone),'시작 구역 오류');
 unique(a.characters,'캐릭터');assert(a.characters.some(c=>c.id==='gladius')&&a.characters.some(c=>c.id==='sera'),'글라디우스와 세라가 필요합니다.');
 a.characters.forEach(c=>{number(c.baseHp,1,1000,c.name+' HP',true);number(c.defenseDamageRatio,0,1,c.name+' 방어 시 피해 비율');assert(c.skills?.length===2,'캐릭터마다 공격 2개가 필요합니다.');unique(c.skills,'공격');c.skills.forEach(s=>{number(s.baseDamage,0,10000,'공격력');number(s.critChance,0,1,'치명타 확률');number(s.critBonus,0,10,'치명타 추가 피해');assert(['physical','magical'].includes(s.attribute),'공격 속성 오류');});});
 for(const k of ['hp','damage','critChance','critBonus']){number(e.perLevel?.[k],0,k.startsWith('crit')?1:100,'강화 증가량',k==='hp');number(e.initialLevels?.[k],0,100,'강화 단계',true);}number(e.critChanceCap,0,1,'치명타 상한');
 const ids=unique(b.actions,'보스 공격'),pids=unique(b.patterns,'보스 패턴');assert(b.actions.length<=100&&b.patterns.length<=100,'공격과 패턴은 각각 최대 100개입니다.');number(b.maxHp,1,1e9,'보스 HP');number(b.encounter?.turns,1,10,'전투 구간 턴 수',true);assert(b.encounter.patternFit==='remainingTurns','남은 턴에 맞춘 패턴 선택이 필요합니다.');
 for(const x of b.actions){number(x.hitCount,1,10,'타격 횟수',true);for(const z of zones){number(x.damageByZone?.[z],0,100,'보스 피해',true);assert(['physical','magical'].includes(x.attributeByZone?.[z]),'보스 공격 속성 오류');for(const at of ['physical','magical'])assert(['enduring','normal','vulnerable'].includes(x.resistanceByZone?.[z]?.[at]),'구역별 내성을 모두 입력하세요.');}}
 for(const p of b.patterns){assert(Array.isArray(p.steps)&&p.steps.length>=1&&p.steps.length<=4,'패턴은 1~4개의 공격으로 구성됩니다: '+p.name);p.steps.forEach(id=>assert(ids.has(id),'없는 공격 ID: '+id));}
 assert(b.selection?.mode==='weightedRandom'&&typeof b.selection.allowImmediateRepeat==='boolean','패턴 선택 규칙 오류');assert(Array.isArray(b.selection.pool)&&b.selection.pool.length>0,'패턴 가중치가 없습니다.');const poolIds=new Set();b.selection.pool.forEach(x=>{assert(pids.has(x.patternId),'없는 패턴 ID: '+x.patternId);assert(!poolIds.has(x.patternId),'가중치 패턴 중복');poolIds.add(x.patternId);number(x.weight,0,10000,'패턴 가중치');});
 // Check every reachable boundary, including states that a lucky sample may not visit.
 const visited=new Set();function fit(left,prev){if(left===0)return;const k=left+':'+prev;if(visited.has(k))return;visited.add(k);const choices=candidates(b,left,prev);assert(choices.length>0,'남은 '+left+'턴에 선택 가능한 패턴이 없습니다 (직전: '+(prev||'없음')+').');choices.forEach(p=>fit(left-p.steps.length,p.id));}if(b.preset?.mode==='random')fit(b.encounter.turns,null);

 ${mode==='custom'?`<div class="panel"><div class="section-head"><h2>사용자 지정 패턴 순서</h2><button id="addCustom">패턴 추가</button></div><p>아래 순서대로 실행합니다. 총 10턴 이하. 패턴 편집은 아래 이름을 눌러 펼치세요.</p>${b.preset.customPatterns.map((id,i)=>`<div class="pattern-order"><span class="order-number">${i+1}</span><select data-order="custom" data-index="${i}" aria-label="${i+1}번째 패턴">${b.patterns.map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>${orderButtons('custom',i,b.preset.customPatterns.length)}</div>`).join('')}</div>`:''}
 ${mode==='direct'?`<div class="panel"><div class="section-head"><h2>공격 직접 지정</h2><button id="addDirect">턴 추가</button></div><p>선택한 상태 순서대로 실행합니다. 이름을 펼치면 구역별 공격을 편집할 수 있습니다.</p>${b.preset.directActions.map((id,i)=>{const ai=b.actions.findIndex(a=>a.id===id),a=b.actions[ai];return `<details data-openkey="direct_${i}"><summary>${String(i+1).padStart(2,'0')} · ${esc(a?.name||id)}</summary><div class="inside"><div class="pattern-order"><select data-order="direct" data-index="${i}" aria-label="${i+1}턴 공격">${b.actions.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>${orderButtons('direct',i,b.preset.directActions.length)}<button data-copy-direct="${i}">이 턴용 공격 복제</button></div>${a?attackEditor(a,ai):''}</div></details>`;}).join('')}</div>`:''}
 <div class="panel"><div class="section-head"><h2>저장된 패턴</h2><button id="newPattern">새 패턴</button></div><p>패턴명만 표시합니다. 이름을 클릭하면 공격 순서와 가중치를 편집할 수 있습니다.</p><div id="patternList">${b.patterns.map((p,i)=>`<details data-openkey="pattern_${p.id}"><summary>${esc(p.name)}</summary><div class="inside"><div class="fields">${textfield('패턴명','bosses.patterns.'+i+'.name',p.name)}<label>선택 가중치<input type="number" min="0" max="10000" step="1" data-weight="${p.id}" value="${b.selection.pool.find(x=>x.patternId===p.id)?.weight||0}"></label></div>${p.steps.map((id,j)=>`<div class="pattern-order"><span class="order-number">${j+1}</span><select data-step-pattern="${i}" data-step-index="${j}" aria-label="${esc(p.name)} ${j+1}번째 공격">${b.actions.map(a=>`<option value="${a.id}" ${id===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select><button data-step-up="${i},${j}" ${j===0?'disabled':''}>↑</button><button data-step-delete="${i},${j}" ${p.steps.length===1?'disabled':''}>제거</button></div>`).join('')}<div class="actions"><button data-step-add="${i}" ${p.steps.length>=4?'disabled':''}>공격 추가 (최대 4)</button><button data-pattern-copy="${i}">패턴 복제</button><button class="danger" data-pattern-delete="${i}" ${b.patterns.length<=1?'disabled':''}>패턴 삭제</button></div><p class="note">이 패턴은 ${p.steps.length}턴입니다. 동일한 공격 ID를 참조하면 공격 편집 내용이 함께 바뀝니다.</p></div></details>`).join('')}</div></div>
 <div class="panel"><div class="section-head"><h2>상태 사전</h2><button id="newAttack">새 상태</button></div><p>패턴과 직접 지정에서 공통으로 참조하는 상태입니다.</p>${b.actions.map((a,i)=>`<details data-openkey="attack_${a.id}"><summary>${esc(a.name)}</summary><div class="inside">${attackEditor(a,i)}<div class="actions"><button data-attack-copy="${i}">공격 복제</button><button class="danger" data-attack-delete="${i}">공격 삭제</button></div></div></details>`).join('')}</div>`;for(const d of document.querySelectorAll('#boss details'))if(opened.includes(d.dataset.openkey))d.open=true;updatePreview();}
function orderButtons(kind,i,length){return `<button class="compact" data-order-move="${kind},${i},-1" ${i===0?'disabled':''} aria-label="위로">↑</button><button class="compact" data-order-move="${kind},${i},1" ${i===length-1?'disabled':''} aria-label="아래로">↓</button><button class="compact" data-order-delete="${kind},${i}" ${length<=1?'disabled':''}>제거</button>`;}
function updatePreview(){if(!$('bossPreview'))return;try{E.validate(data);const s=E.schedule(data.bosses);$('bossPreview').innerHTML=`<p>실행 미리보기 · ${s.turns.length}턴</p><div class="sequence">${s.turns.map((a,i)=>`<span><small>T${i+1}${a.patternId?' / '+esc(data.bosses.patterns.find(p=>p.id===a.patternId)?.name):''}</small>${esc(a.name)}</span>`).join('')}</div>`;}catch(e){$('bossPreview').textContent=e.message;}}
function renderExact(){const p=E.profile(data,exact.character);$('exact').innerHTML=`<div class="panel"><div class="section-head"><div><h2>최적 행동 탐색</h2><p>동일한 보스 행동열에서 생존 가능한 고정 행동 순서를 비교합니다.</p></div><span class="badge">독립 실험 01</span></div><div class="fields">${select('캐릭터','character',exact.character,charOptions(),'exact')}${select('분석 모드','mode',exact.mode,[['position','위치 반영'],['probability','피격 확률 입력']],'exact')}${nfield('최초 탐색 라인','count',exact.count,{min:1,max:50,scope:'exact'})}${nfield('편집 후 추가 라인','additional',exact.additional,{min:1,max:50,scope:'exact'})}${nfield('추첨 시드','seed',exact.seed,{max:4294967295,scope:'exact'})}<label>시작 HP (빈칸 = 공통값)<input id="exactHp" type="number" min="1" max="10000" value="${exact.start.hp??''}" placeholder="${p.maxHp}"></label><label>시작 피버 (빈칸 = 공통값)<input id="exactFever" type="number" min="0" value="${exact.start.fever??''}" placeholder="${data.abilities.initial.fever}"></label></div>${check('같은 대미지 라인 생략','unique',exact.unique,'exact')}<details><summary>이 실험의 강화 단계</summary><div class="inside fields">${Object.entries({hp:'체력',damage:'공격',critChance:'치명타 확률',critBonus:'치명타 피해'}).map(([k,l])=>nfield(l,'levels.'+k,exact.levels[k],{max:100,scope:'exact'})).join('')}</div></details><div id="probabilityEditor"></div><div class="actions" style="margin-top:20px"><button id="runExact" class="primary">최적 행동 계산</button><button id="stopExact" disabled>계산 취소</button><button id="runStats">전체 라인 생존·딜 분포</button></div><progress id="exactProgress" hidden></progress><p class="note">위치 모드는 생존 라인의 기대 피해, 확률 모드는 생존에 성공한 경우의 평균 피해로 순위를 정합니다. 공격 결과별 피해는 반올림되지만 기대값은 소수일 수 있습니다.</p></div><div id="exactOutput">${exactResult?'':'<div class="empty">계산을 실행하면 행동 라인과 턴별 결과가 표시됩니다.</div>'}</div><div id="statsOutput"></div>`;
 $('exactHp').onchange=e=>{exact.start.hp=e.target.value===''?undefined:Number(e.target.value);};$('exactFever').onchange=e=>{exact.start.fever=e.target.value===''?undefined:Number(e.target.value);};renderProbabilities();if(exactResult)renderExactResults();}
function renderProbabilities(){const el=$('probabilityEditor');if(!el)return;if(exact.mode!=='probability'){el.innerHTML='';return;}let turns;try{turns=E.schedule(data.bosses).turns;}catch{return;}el.innerHTML=`<details open><summary>턴별 피격 확률 · 실험 전용</summary><div class="inside"><div class="table-wrap"><table><thead><tr><th>턴</th><th>공격 Pa (%)</th><th>방어 Pd (%)</th><th>회피 Pe (%)</th><th>피격 피해</th><th>물리 내성</th><th>마법 내성</th></tr></thead><tbody>${turns.map((a,i)=>{exact.probabilities[i]??={pa:.5,pd:.5,pe:.15,damage:2,physical:'normal',magical:'normal'};const p=exact.probabilities[i];return `<tr><td>${i+1} · ${esc(a.name)}</td>${['pa','pd','pe','damage'].map(k=>`<td>${nfield('',`probabilities.${i}.${k}`,p[k],{scale:k==='damage'?1:100,max:100,scope:'exact'})}</td>`).join('')}<td>${select('',`probabilities.${i}.physical`,p.physical,resistance,'exact')}</td><td>${select('',`probabilities.${i}.magical`,p.magical,resistance,'exact')}</td></tr>`;}).join('')}</tbody></table></div></div></details>`;}
function snapshotLabel(v){return `<p data-stale class="stale">${v===generation?'실행 당시 공통 데이터와 현재 데이터가 같습니다.':'이전 공통 데이터로 실행한 결과입니다. 다시 실행하면 변경값이 적용됩니다.'}</p>`;}
function renderExactResults(){const r=exactResult;$('exactOutput').innerHTML=`<div class="panel"><div class="section-head"><h2>최적 행동 라인</h2><button id="exportExact">결과 CSV 저장</button></div>${snapshotLabel(exactVersion)}<p>${esc(r.character)} · ${r.turns.length}턴 · ${fmt(r.visited,0)} 상태 탐색 · 행동을 바꾸면 해당 턴까지 고정한 대안을 추가합니다.</p>${!r.lines.length?'<div class="empty">생존 가능한 라인이 없습니다. HP나 보스 피해를 조정해 주세요.</div>':`<div class="table-wrap"><table><thead><tr><th>라인</th>${r.turns.map((a,i)=>`<th title="${esc(a.name)}">T${i+1}</th>`).join('')}<th>평균 피해</th><th>생존율</th><th>종료 HP</th></tr></thead><tbody>${r.lines.map((l,i)=>`<tr class="${i===selectedLine?'selected':''}"><td><button data-line="${i}" class="compact">${i+1}${l.branch?' · 분기':''}</button></td>${l.actions.map((a,t)=>{let s={z:E.zones.indexOf(exactSnapshot.opts.start.zone??exactSnapshot.data.abilities.initial.zone)};for(let j=0;j<t;j++)if(l.actions[j]>=3&&r.mode==='position')s.z=l.actions[j]-3;return `<td><select data-line-edit="${i},${t}" aria-label="${i+1}번 라인 ${t+1}턴">${E.actions(s,exactSnapshot.data.abilities.rules,r.mode).map(x=>`<option value="${x}" ${x===a?'selected':''}>${r.mode==='probability'&&x===3?'회피':E.names[x]}</option>`).join('')}</select></td>`;}).join('')}<td>${fmt(l.damage)}</td><td>${pct(l.survival)}</td><td>${fmt(l.endHp)}</td></tr>`).join('')}</tbody></table></div>`}</div><div id="traceOutput"></div>`;renderTrace();}
function renderTrace(){const l=exactResult?.lines[selectedLine];if(!l){$('traceOutput').innerHTML='';return;}$('traceOutput').innerHTML=`<div class="panel"><h2>${selectedLine+1}번 라인 · 턴별 상태</h2><div class="table-wrap"><table><thead><tr><th>턴 / 보스 공격</th><th>행동</th><th>위치</th><th>피버 전 → 후</th><th>피해</th><th>생존율</th><th>생존 시 HP</th></tr></thead><tbody>${l.trace.map(t=>`<tr><td>${t.t} · ${esc(t.boss)}</td><td>${E.names[t.a]}</td><td>${Z[E.zones[t.after.z]]}</td><td>${fmt(t.before.f)} → ${fmt(t.after.f)}</td><td>${fmt(t.damage)}</td><td>${pct(t.survival)}</td><td>${fmt(t.hp)}</td></tr>`).join('')}</tbody></table></div></div>`;}
function renderTeam(){const o=team;$('team').innerHTML=`<div class="panel"><div class="section-head"><div><h2>AI 전투 실험</h2><p>참가자별 패턴 판독과 체력 비용을 반영해, 행동·사망·피해를 비교합니다.</p></div><span class="badge">독립 실험 02</span></div><div class="fields">${nfield('시퀀스 수','sequences',o.sequences,{min:1,max:100,scope:'team'})}${nfield('반복 횟수','iterations',o.iterations,{min:1,max:50000,scope:'team'})}${nfield('난수 시드','seed',o.seed,{max:4294967295,scope:'team'})}${nfield('AI 예측 깊이 (턴)','lookahead',o.lookahead,{min:1,max:10,scope:'team'})}</div><p class="note">AI는 설정한 깊이까지 기대 피해 − HP 손실 비용 − 사망 비용을 비교합니다. 랜덤 패턴 모드는 관측한 공격으로 패턴 후보를 갱신합니다. 직접·사용자 지정 순서는 예정된 미래 공격을 아는 비교 실험입니다. 구간 사이 HP·피버·사망은 유지되며, 반복 실험마다 초기화됩니다.</p><div class="actions"><button id="runLive" class="primary">전투 시작·초기화</button><button id="runTeam">사망 확률 반복 실험</button><button id="stopTeam" disabled>계산 취소</button></div><progress id="teamProgress" hidden></progress><details class="roster"><summary>AI 참가자 · 캐릭터·성향·시작 위치</summary><div class="inside"><div class="actions"><button id="copyAI">AI 01 설정을 전체에 복사</button><button id="resetZones">공통 시작 위치 적용</button></div>${o.players.map((p,i)=>`<div class="skill"><strong>${esc(p.name)}</strong><div class="fields">${select('캐릭터',`players.${i}.character`,p.character,charOptions(),'team')}${select('시작 위치',`players.${i}.zone`,p.zone,Object.entries(Z),'team')}${nfield('판독 성공률 (%)',`players.${i}.q`,p.q,{max:100,scope:'team'})}${nfield('HP 임계치 (%)',`players.${i}.threshold`,p.threshold,{max:100,scope:'team'})}${nfield('임계치 아래 HP 비용',`players.${i}.hpCost`,p.hpCost,{max:1000,scope:'team'})}${nfield('사망 비용',`players.${i}.deathCost`,p.deathCost,{max:10000,scope:'team'})}</div></div>`).join('')}</div></details></div><div id="teamOutput"></div><div class="panel"><h2>체력 × 판독 성공률 비교</h2><p>9개 조건과 공격만·방어만·회피만의 기본 정책을 비교합니다.</p><div class="toolbar"><label>HP 3개<input id="sweepHP" value="3,5,7"></label><label>판독 확률 3개 (%)<input id="sweepQ" value="40,65,90"></label><label>조건당 반복<input id="sweepN" type="number" min="1" max="10000" value="100"></label><button id="runSweep">9개 조건 비교</button><button id="stopSweep" disabled>취소</button></div><progress id="sweepProgress" hidden></progress><div id="sweepOutput"></div></div>`;if(teamResult)renderTeamResults();}
function renderTeamResults(){const r=teamResult;$('teamOutput').innerHTML=`<div class="panel"><div class="section-head"><h2>${r.iterations===1?'전투 재생':'반복 실험 결과'}</h2><button id="exportTeam">결과 CSV 저장</button></div>${snapshotLabel(teamVersion)}<div class="metrics">${metric('개인 평균 생존율',pct(r.survival))}${metric('팀 평균 피해',fmt(r.damage))}${metric('전원 생존',pct(r.hist[0]/r.iterations))}${metric('전멸',pct(r.hist[r.hist.length-1]/r.iterations))}</div><p>팀 피해 95% 구간 ${r.damageCI.map(x=>fmt(x)).join(' ~ ')} · 사망한 턴의 공격 피해 포함</p>${r.iterations===1?`<div class="actions"><button id="livePrev">이전 턴</button><button id="liveNext">다음 턴</button><button id="liveSequence">다음 시퀀스</button><button id="livePlay">자동 재생</button><span id="livePosition"></span></div><div id="liveOutput"></div>`:`<h3>사망 인원 분포</h3>${r.hist.map((n,i)=>bar(i+'명 사망',n/r.iterations,pct(n/r.iterations))).join('')}`}<div class="table-wrap"><table><thead><tr><th>AI</th><th>사망 확률</th><th>평균 피해</th><th>평균 종료 HP</th><th>공격 / 방어 / 회피</th></tr></thead><tbody>${r.by.map((x,i)=>`<tr><td>${esc(teamSnapshot.opts.players[i].name)} · ${esc(teamSnapshot.data.abilities.characters.find(c=>c.id===teamSnapshot.opts.players[i].character).name)}</td><td>${pct(x.dead)}</td><td>${fmt(x.damage)}</td><td>${fmt(x.hp)}</td><td>${x.counts.map(v=>fmt(v/r.iterations,1)).join(' / ')}</td></tr>`).join('')}</tbody></table></div></div>`;if(r.iterations===1)renderLive();}

$('files').onchange=async e=>{try{const picked=[...e.target.files];if(!picked.length) return;const draft=E.clone(data),seen=new Set();for(const f of picked){if(f.size>2000000)throw Error('JSON 파일은 각각 2MB 이하만 지원합니다.');const v=JSON.parse(await f.text()),k=(v.schemaVersion===2&&Array.isArray(v.states)?'bosses':Object.keys(files).find(k=>v.kind==='gladius-'+({abilities:'abilities',bosses:'boss-patterns',enhancements:'enhancements'}[k])));if(!k||seen.has(k))throw Error('지원하지 않는 JSON이거나 같은 종류의 파일이 중복되었습니다.');seen.add(k);draft[k]=v;}E.validate(draft);data=draft;handles={};source='선택한 JSON '+picked.length+'개';afterLoad();status('선택한 JSON을 검증하고 적용했습니다.');}catch(err){status(err.message,true);}e.target.value='';};
E.validate(data);renderCommon();renderBoss();renderExact();renderTeam();$('sourceState').textContent=source;changed();
if(location.protocol==='http:'||location.protocol==='https:'){Promise.all(Object.keys(files).map(async k=>{let r=k==='bosses'?await fetch(files[k],{cache:'no-store'}):null;if(!r?.ok)r=await fetch('Data/'+files[k],{cache:'no-store'});if(!r.ok){if(k!=='bosses')return [k,E.clone(EMBEDDED[k])];throw Error(files[k]+' 읽기 실패');}return [k,await r.json()];})).then(entries=>{const next=Object.fromEntries(entries);E.validate(next);data=next;source='Data 폴더의 JSON 3개';afterLoad();status('공통 JSON 3개를 불러왔습니다.');}).catch(e=>status('외부 JSON을 읽지 못해 내장 초기값을 사용합니다: '+e.message,true));}
